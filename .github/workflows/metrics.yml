name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# 🔑 REQUIRED PERMISSIONS
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          user: sai1432-ss

          # Base settings
          template: classic
          base: activity
          base_activity: true
          base_community: false
          base_repositories: false
          base_metadata: false

          # MONTH-WISE CONTRIBUTION CALENDAR
          plugin_isocalendar: true
          plugin_isocalendar_duration: full-year

          # Timezone
          config_timezone: Asia/Kolkata

          # Output file
          filename: github-metrics.svg
