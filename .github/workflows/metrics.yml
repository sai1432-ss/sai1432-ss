name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Monthly Contribution Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sai1432-ss

          # Template
          template: classic
          base: activity

          # MONTH-WISE CALENDAR
          plugin_isocalendar: true
          plugin_isocalendar_duration: full-year

          # Timezone
          config_timezone: Asia/Kolkata

          # Output file
          filename: github-metrics.svg
