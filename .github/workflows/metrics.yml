name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Clean Monthly Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sai1432-ss

          # Minimal base (no 3D, no clutter)
          base: ""

          # CLEAN MONTH-WISE CALENDAR (2D)
          plugin_isocalendar: true
          plugin_isocalendar_duration: full-year

          # Clean visuals
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: false

          # Output
          filename: github-metrics.svg
